name: Parstream
description: ParStream was a big-data analytics database company founded in 2011 in Cologne, Germany
  by Michael Hummel, Joerg Bienert and Norbert Heuber. Its columnar, GPU-accelerated OLAP database
  was built for Internet-of-Things environments, filtering and analyzing billions of records in
  sub-second time at the edge of the network, with query access via SQL and a JSON query format
  plus a C++ API for user-defined query nodes. Cisco acquired ParStream on October 26, 2015 and
  folded the team into its Data and Analytics Group; the standalone product was declared obsolete
  and retired in 2018. The former parstream.com domain now redirects to a Cisco end-of-life product
  page, and no independent developer portal, API, SDK, or discovery surface remains to enrich.
